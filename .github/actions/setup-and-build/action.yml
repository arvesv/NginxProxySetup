name: "Setup and Build"
description: "Configures Node.js, installs dependencies, runs tests, and builds package"

inputs:
  node-version:
    description: "Node.js version to set up"
    required: false
    default: "22"
  registry-url:
    description: "Optional npm registry URL for publishing or scoped packages"
    required: false
    default: ""
  scope:
    description: "Optional npm scope"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}
        cache: "npm"

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Run tests
      shell: bash
      run: npm test

    - name: Build package
      shell: bash
      run: npm run build

